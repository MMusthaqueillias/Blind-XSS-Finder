{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{hedder}}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">   
     <style>
      a {
    text-decoration: none;
}
.login-page {
    width: 100%;
    height: 100vh;
    display: inline-block;
    display: flex;
    align-items: center;
}
.form-right i {
    font-size: 100px;
}
     </style>
   <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>

   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/polipop/dist/css/polipop.core.min.css" />
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/polipop/dist/css/polipop.default.min.css" />

   <script src="https://cdn.jsdelivr.net/npm/polipop/dist/polipop.min.js"></script>
   <script src="{% static 'message.js' %}"></script>
   <script src="{% static 'custome.js' %}"></script>
 
</head>
<body>

  {% include 'Message.html'%}
    <div class="login-page bg-light">
        <div class="container">
            <div class="row">
                <div class="col-lg-10 offset-lg-1">
                  <h3 class="mb-3">Signup Now</h3>
                    <div class="bg-white shadow rounded">
                        <div class="row">
                            <div class="col-md-7 pe-0">
                                <div class="form-left h-100 py-5 px-5">
                                    <form method="post" class="row g-4">
                                      {% csrf_token %} 
                                      <div class="col-12">
                                        <label>Email<span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <div class="input-group-text"><i class="bi bi-person-fill"></i></div>
                                            <input name="email"  type="email" class="form-control" placeholder="Enter Email" required>
                                        </div>
                                    </div>
                                            <div class="col-12">
                                                <label>Username<span class="text-danger">*</span></label>
                                                <div class="input-group">
                                                    <div class="input-group-text"><i class="bi bi-person-fill"></i></div>
                                                    <input name="username"  type="text" class="form-control" placeholder="Enter Username" required>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <label>Password<span class="text-danger">*</span></label>
                                                <div class="input-group">
                                                    <div class="input-group-text"><i class="bi bi-lock-fill"></i></div>
                                                    <input name="password" type="password" class="form-control" placeholder="Enter Password" required>
                                                </div>
                                            </div>



                                            <div class="col-12">
                                                <button type="submit" class="btn btn-primary px-4 float-end mt-4">Signup</button>
                                            </div>
                                            <div class="col-sm-6">
                                              <a href="/login" class="float-end text-primary">Do you have account?</a>
                                          </div>
                                    </form>
                                </div>
                              
                            </div>
                            <div class="col-md-5 ps-0 d-none d-md-block">
                                <div class="form-right h-100 bg-primary text-white text-center pt-5">
                                    <i class="bi bi-bootstrap"></i>
                                    <h2 class="fs-1">Welcome Back!!!</h2><br>
                                    <h2 class="fs-1">{{hedder}}</h2>
                                </div>
                            </div>
                        </div>
                    </div>
           
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
     
</body>
</html>
